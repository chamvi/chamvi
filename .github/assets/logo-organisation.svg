<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ca-title">
    <title id="ca-title">chamvi organisation avatar: the approval seal around one arched chamber holding its checkpointed steps</title>
    <style>
        :root {
            --accent: #4DB3E6;
            --ink: #0B2233;
            --grey: #9BB0BF;
            --bg: #FFFFFF;
            --seal: #E6F4FB;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #9AD8F5;
                --ink: #E2F0F8;
                --grey: #5F7A8C;
                --bg: #0A1620;
                --seal: #0E1D28;
            }
        }
        .accent { fill: var(--accent); }
        .ink { fill: var(--ink); }
        .grey { fill: var(--grey); }
        .bg { fill: var(--bg); }
        .seal { fill: var(--seal); }
        .accent-line { stroke: var(--accent); }
        .ink-line { stroke: var(--ink); }
        .accent-stop { stop-color: var(--accent); }
        .ink-stop { stop-color: var(--ink); }
    </style>
    <defs>
        <linearGradient id="ca-stone" x1="128" y1="70" x2="128" y2="190" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#4DB3E6"/>
            <stop offset="1" class="ink-stop" stop-color="#0B2233"/>
        </linearGradient>
    </defs>
    <rect width="256" height="256" class="bg" fill="#FFFFFF"/>
    <g transform="translate(128 128) scale(0.86) translate(-128 -128)">
    <!-- the approval seal -->
    <path d="M232.2 119.3 Q226.5 110.6 228.9 100.5 Q231.4 90.4 223.0 84.2 Q214.6 78.0 213.4 67.6 Q212.3 57.3 202.3 54.3 Q192.3 51.4 187.6 42.1 Q183.0 32.7 172.6 33.4 Q162.2 34.0 154.7 26.9 Q147.1 19.7 137.6 23.8 Q128.0 28.0 118.4 23.8 Q108.9 19.7 101.3 26.9 Q93.8 34.0 83.4 33.4 Q73.0 32.7 68.4 42.1 Q63.7 51.4 53.7 54.3 Q43.7 57.3 42.6 67.6 Q41.4 78.0 33.0 84.2 Q24.6 90.4 27.1 100.5 Q29.5 110.6 23.8 119.3 Q18.0 128.0 23.8 136.7 Q29.5 145.4 27.1 155.5 Q24.6 165.6 33.0 171.8 Q41.4 178.0 42.6 188.4 Q43.7 198.7 53.7 201.7 Q63.7 204.6 68.4 213.9 Q73.0 223.3 83.4 222.6 Q93.8 222.0 101.3 229.1 Q108.9 236.3 118.4 232.2 Q128.0 228.0 137.6 232.2 Q147.1 236.3 154.7 229.1 Q162.2 222.0 172.6 222.6 Q183.0 223.3 187.6 213.9 Q192.3 204.6 202.3 201.7 Q212.3 198.7 213.4 188.4 Q214.6 178.0 223.0 171.8 Q231.4 165.6 228.9 155.5 Q226.5 145.4 232.2 136.7 Q238.0 128.0 232.2 119.3 Z" class="seal" fill="#E6F4FB"/>
    <path d="M232.2 119.3 Q226.5 110.6 228.9 100.5 Q231.4 90.4 223.0 84.2 Q214.6 78.0 213.4 67.6 Q212.3 57.3 202.3 54.3 Q192.3 51.4 187.6 42.1 Q183.0 32.7 172.6 33.4 Q162.2 34.0 154.7 26.9 Q147.1 19.7 137.6 23.8 Q128.0 28.0 118.4 23.8 Q108.9 19.7 101.3 26.9 Q93.8 34.0 83.4 33.4 Q73.0 32.7 68.4 42.1 Q63.7 51.4 53.7 54.3 Q43.7 57.3 42.6 67.6 Q41.4 78.0 33.0 84.2 Q24.6 90.4 27.1 100.5 Q29.5 110.6 23.8 119.3 Q18.0 128.0 23.8 136.7 Q29.5 145.4 27.1 155.5 Q24.6 165.6 33.0 171.8 Q41.4 178.0 42.6 188.4 Q43.7 198.7 53.7 201.7 Q63.7 204.6 68.4 213.9 Q73.0 223.3 83.4 222.6 Q93.8 222.0 101.3 229.1 Q108.9 236.3 118.4 232.2 Q128.0 228.0 137.6 232.2 Q147.1 236.3 154.7 229.1 Q162.2 222.0 172.6 222.6 Q183.0 223.3 187.6 213.9 Q192.3 204.6 202.3 201.7 Q212.3 198.7 213.4 188.4 Q214.6 178.0 223.0 171.8 Q231.4 165.6 228.9 155.5 Q226.5 145.4 232.2 136.7 Q238.0 128.0 232.2 119.3 Z" class="accent-line" stroke="#4DB3E6" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="80" class="accent-line" stroke="#4DB3E6" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="3 7"/>
    <!-- the running chamber is lit -->
    <path d="M98 184 V106 A30 30 0 0 1 158 106 V184 Z" class="accent" fill="#4DB3E6" fill-opacity="0.28"/>
    <path d="M98 184 V106 A30 30 0 0 1 158 106 V184" stroke="url(#ca-stone)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 189 H176" class="ink-line" stroke="#0B2233" stroke-width="10" stroke-linecap="round"/>
    <!-- checkpointed steps, stacked bottom up: done, pending, running -->
    <rect x="110" y="162" width="36" height="14" rx="7" class="ink" fill="#0B2233"/>
    <rect x="110" y="143" width="36" height="14" rx="7" class="grey" fill="#9BB0BF"/>
    <rect x="110" y="124" width="36" height="14" rx="7" class="accent" fill="#4DB3E6"/>
    </g>
</svg>
