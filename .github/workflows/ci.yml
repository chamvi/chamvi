name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Install
              uses: ./.github/actions/install
              with:
                  node-version: 26
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Test
              run: npm run test

    e2e:
        name: E2E (Chromium)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Install
              uses: ./.github/actions/install
              with:
                  node-version: 26
            - name: Build
              uses: ./.github/actions/build
            - name: Read the Playwright version
              id: playwright
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
            - name: Cache the browser
              id: browser-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
            - name: Install Chromium
              if: steps.browser-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
            - name: Install Chromium system dependencies
              if: steps.browser-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium
            # TEMPORARY (reverted in the next commit): record the Linux baselines, then compare against them once, retries off
            - name: Record the Linux baselines
              run: npm run test:e2e -w @chamvi/ui -w @chamvi/tool-mail-ui -w @chamvi/chat-whatsapp-ui -- --update-snapshots=missing
              env:
                  CI: true
            - name: Compare against the new baselines
              run: npm run test:e2e -w @chamvi/ui -w @chamvi/tool-mail-ui -w @chamvi/chat-whatsapp-ui -- --retries=0
              env:
                  CI: true
            - name: Upload the baselines
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: linux-baselines
                  path: packages/*/test/e2e/__snapshots__
                  retention-days: 7
            - name: Upload the report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      packages/*/playwright-report
                      packages/*/test-results
                  retention-days: 7
