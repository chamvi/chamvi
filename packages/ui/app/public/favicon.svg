            --ink: #0B2233;
            --grey: #9BB0BF;
            --bg: #FFFFFF;
            --seal: #E6F4FB;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #9AD8F5;
                --ink: #E2F0F8;
                --grey: #5F7A8C;
                --bg: #0A1620;
                --seal: #0E1D28;
            }
        }
        .accent { fill: var(--accent); }
        .ink { fill: var(--ink); }
        .grey { fill: var(--grey); }
        .bg { fill: var(--bg); }
        .seal { fill: var(--seal); }
        .accent-line { stroke: var(--accent); }
        .ink-line { stroke: var(--ink); }
        .accent-stop { stop-color: var(--accent); }
        .ink-stop { stop-color: var(--ink); }
    </style>
